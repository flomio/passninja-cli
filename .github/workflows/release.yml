name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
          - goos: windows
            goarch: '386'
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags "-s -w \
            -X main.version=${VERSION} \
            -X main.commit=${COMMIT} \
            -X main.buildDate=${DATE}" \
            -o "dist/passninja-${GOOS}-${GOARCH}${EXT}" .
      - uses: actions/upload-artifact@v4
        with:
          name: passninja-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/passninja-*

  package-mcpb:
    name: Package signed .mcpb bundle
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-collected
      - name: Flatten platform binaries into dist/
        run: |
          mkdir -p dist
          find dist-collected -type f -name 'passninja-*' -exec cp {} dist/ \;
          chmod +x dist/passninja-darwin-* dist/passninja-linux-*
      - name: Import Developer ID Application cert into a temporary keychain
        env:
          APPLE_CERTIFICATE_P12:      ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          KC="$RUNNER_TEMP/build.keychain"
          KC_PASS="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain    -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Pre-authorize codesign access to the private key without GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Stage Apple App Store Connect API key for notarytool
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          echo "$APPLE_API_KEY_P8" | base64 -d \
            > "$RUNNER_TEMP/notary/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
      - name: Build, codesign, and notarize the .mcpb
        env:
          APPLE_SIGN_IDENTITY:  ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_PATH:   ${{ runner.temp }}/notary/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID:     ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID:  ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./mcpb/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: dist/passninja.mcpb

  release:
    name: Publish release
    needs: [build, package-mcpb]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256:  ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-collected
      - name: Flatten + checksum
        run: |
          mkdir -p dist
          find dist-collected -type f \( -name 'passninja-*' -o -name 'passninja.mcpb' \) -exec cp {} dist/ \;
          cd dist && shasum -a 256 passninja-* passninja.mcpb > SHA256SUMS
          ls -la
      - name: Stage Windows install script
        run: cp scripts/install.ps1 dist/install.ps1
      - id: meta
        name: Compute source-tarball sha256 (for the Homebrew formula)
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          TAR_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz"
          curl -sL "$TAR_URL" -o /tmp/src.tar.gz
          SHA=$(shasum -a 256 /tmp/src.tar.gz | awk '{print $1}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA}"      >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/passninja-*
            dist/passninja.mcpb
            dist/SHA256SUMS
            dist/install.ps1

  bump-tap:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: flomio/homebrew-passninja
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Bump formula and open PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256:  ${{ needs.release.outputs.sha256 }}
        run: |
          cd tap
          VERSION_NUMERIC=${VERSION#v}
          BRANCH="bump/${VERSION}"
          git config user.name  "passninja-release-bot"
          git config user.email "release-bot@flomio.com"
          git checkout -b "$BRANCH"
          sed -i.bak -E "s|archive/refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+\\.tar\\.gz|archive/refs/tags/${VERSION}.tar.gz|" Formula/passninja.rb
          sed -i.bak -E "s|sha256 \"[0-9a-f]{64}\"|sha256 \"${SHA256}\"|" Formula/passninja.rb
          rm -f Formula/passninja.rb.bak
          git add Formula/passninja.rb
          git commit -m "passninja ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "passninja ${VERSION}" \
            --body "Automated bump from flomio/passninja-cli release ${VERSION}."
